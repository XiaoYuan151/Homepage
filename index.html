<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-void:    #04060a;
    --bg-deep:    #080c14;
    --bg-window:  #0a0e18;
    --bg-title:   #0c1020;
    --border:     #1a2238;
    --border-hi:  #243352;
    --border-focus: rgba(0,255,200,0.25);
    --text:       #b8c4d4;
    --text-dim:   #3e5068;
    --text-bright:#e0eaf6;
    --neon-cyan:  #00ffc8;
    --neon-blue:  #00aaff;
    --neon-pink:  #ff2d7c;
    --neon-amber: #ffb830;
    --neon-red:   #ff3b4e;
    --neon-green: #00ff88;
    --glow-cyan:  rgba(0,255,200,0.15);
    --glow-blue:  rgba(0,170,255,0.12);
    --glow-pink:  rgba(255,45,124,0.1);
    --shadow-key: rgba(0,0,0,0.8);
    --shadow-neon: rgba(0,255,200,0.06);
    --scanline-opacity: 0.035;
  }

  html, body { height: 100%; background: var(--bg-void); overflow: hidden; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', 'Cascadia Code', 'SF Mono', monospace;
    font-size: 13.5px;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(0,255,200,0.03) 0%, transparent 50%),
      radial-gradient(ellipse at 75% 70%, rgba(0,170,255,0.025) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 50%, rgba(255,45,124,0.012) 0%, transparent 60%),
      var(--bg-void);
    cursor: default;
  }

  /* ── ambient floating particles ────────────────────────────── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 15% 25%, rgba(0,255,200,0.3), transparent),
      radial-gradient(1px 1px at 45% 65%, rgba(0,170,255,0.2), transparent),
      radial-gradient(1px 1px at 78% 18%, rgba(0,255,200,0.25), transparent),
      radial-gradient(1px 1px at 92% 82%, rgba(0,170,255,0.15), transparent),
      radial-gradient(1.5px 1.5px at 22% 88%, rgba(255,45,124,0.18), transparent),
      radial-gradient(1px 1px at 55% 35%, rgba(0,255,200,0.2), transparent),
      radial-gradient(1px 1px at 8% 55%, rgba(0,170,255,0.15), transparent),
      radial-gradient(1px 1px at 68% 48%, rgba(0,255,200,0.12), transparent);
    animation: particleDrift 25s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes particleDrift {
    0%   { transform: translate(0, 0); }
    50%  { transform: translate(-8px, 12px); }
    100% { transform: translate(5px, -6px); }
  }

  /* ── window ────────────────────────────────────────────────── */
  .window {
    position: relative;
    width: 100%;
    max-width: 780px;
    height: 100vh;
    max-height: 560px;
    background: var(--bg-window);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 1;
    box-shadow:
      0 0 0 1px rgba(0,255,200,0.04) inset,
      0 0 1px rgba(0,0,0,0.6),
      0 4px 12px rgba(0,0,0,0.4),
      0 12px 40px var(--shadow-key),
      0 0 80px var(--shadow-neon),
      0 0 160px rgba(0,255,200,0.02);
    animation: windowIn 0.65s cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }
  @keyframes windowIn {
    from { opacity: 0; transform: translateY(18px) scale(0.98); filter: brightness(1.8) blur(2px); }
    to   { opacity: 1; transform: translateY(0) scale(1); filter: brightness(1) blur(0); }
  }
  .window:hover { border-color: var(--border-hi); box-shadow:
    0 0 0 1px rgba(0,255,200,0.06) inset,
    0 0 1px rgba(0,0,0,0.6),
    0 4px 12px rgba(0,0,0,0.4),
    0 12px 40px var(--shadow-key),
    0 0 100px rgba(0,255,200,0.04),
    0 0 200px rgba(0,255,200,0.02);
  }
  .window:focus-within { border-color: var(--border-focus); }

  /* ── CRT scanlines overlay ──────────────────────────────── */
  .window::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,var(--scanline-opacity)) 2px,
      rgba(0,0,0,var(--scanline-opacity)) 4px
    );
    pointer-events: none;
    z-index: 100;
    border-radius: 8px;
  }

  /* ── CRT screen curvature vignette ──────────────────────── */
  .window::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(
      ellipse at center,
      transparent 60%,
      rgba(0,0,0,0.3) 100%
    );
    pointer-events: none;
    z-index: 101;
    border-radius: 8px;
  }

  /* ── titlebar ──────────────────────────────────────────────── */
  .titlebar {
    position: relative;
    background: var(--bg-title);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
    user-select: none;
    border-bottom: 1px solid var(--border);
    z-index: 2;
  }
  .titlebar::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg,
      transparent 0%,
      var(--neon-cyan) 20%,
      var(--neon-blue) 50%,
      var(--neon-cyan) 80%,
      transparent 100%
    );
    opacity: 0.2;
  }

  .dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
    position: relative;
    transition: all 0.25s;
    cursor: pointer;
  }
  .dot.r { background: var(--neon-red); box-shadow: 0 0 6px rgba(255,59,78,0.4), 0 0 0 0.5px rgba(0,0,0,0.3) inset; }
  .dot.y { background: var(--neon-amber); box-shadow: 0 0 6px rgba(255,184,48,0.3), 0 0 0 0.5px rgba(0,0,0,0.3) inset; }
  .dot.g { background: var(--neon-green); box-shadow: 0 0 6px rgba(0,255,136,0.3), 0 0 0 0.5px rgba(0,0,0,0.3) inset; }
  .dot:hover { filter: brightness(1.4); transform: scale(1.15); }
  .dot::after {
    content: '';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 7px;
    font-weight: 700;
    line-height: 1;
    color: rgba(0,0,0,0.55);
    opacity: 0;
    transition: opacity 0.2s;
    font-family: -apple-system, 'SF Pro Display', sans-serif;
    pointer-events: none;
  }
  .dot.r::after { content: '\00d7'; }
  .dot.y::after { content: '\2212'; }
  .dot.g::after { content: '\002b'; }
  .dot:hover::after { opacity: 1; }

  .titlebar .title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Orbitron', 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--neon-cyan);
    text-shadow: 0 0 8px var(--glow-cyan), 0 0 20px rgba(0,255,200,0.08);
    pointer-events: none;
  }

  .titlebar .hex-addr {
    position: absolute;
    right: 16px;
    font-size: 9px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text-dim);
    letter-spacing: 1px;
    opacity: 0.6;
  }

  /* ── body ───────────────────────────────────────────────────── */
  .body {
    flex: 1;
    padding: 20px 22px;
    overflow-y: auto;
    cursor: text;
    line-height: 1.78;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    position: relative;
    z-index: 2;
  }
  .body::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.022;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 180px 180px;
    z-index: 0;
  }
  .body::-webkit-scrollbar { width: 4px; }
  .body::-webkit-scrollbar-track { background: transparent; }
  .body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .body::-webkit-scrollbar-thumb:hover { background: var(--neon-cyan); box-shadow: 0 0 6px var(--glow-cyan); }

  /* ── output ─────────────────────────────────────────────────── */
  #output { position: relative; z-index: 1; }
  #output .line {
    white-space: pre;
    min-height: 1.5em;
  }
  #output .line.dim  { color: var(--text-dim); }
  #output .line.err  { color: var(--neon-red); text-shadow: 0 0 8px rgba(255,59,78,0.2); }
  #output .line.info { color: var(--neon-cyan); text-shadow: 0 0 6px var(--glow-cyan); }
  #output .line.warn { color: var(--neon-amber); text-shadow: 0 0 6px rgba(255,184,48,0.15); }
  #output .line.neon { color: var(--neon-cyan); text-shadow: 0 0 10px var(--glow-cyan), 0 0 30px rgba(0,255,200,0.06); }
  #output .line.pink { color: var(--neon-pink); text-shadow: 0 0 10px var(--glow-pink); }

  #output a {
    color: var(--neon-blue);
    text-decoration: none;
    transition: all 0.2s;
    position: relative;
  }
  #output a:hover {
    color: var(--neon-cyan);
    text-shadow: 0 0 12px var(--glow-cyan);
    text-decoration: none;
  }
  #output a::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0; right: 0;
    height: 1px;
    background: var(--neon-blue);
    opacity: 0;
    transition: opacity 0.2s;
  }
  #output a:hover::after { opacity: 0.5; }

  /* ── MOTD box ──────────────────────────────────────────────── */
  .motd-box {
    display: inline-block;
    border: 1px solid var(--border-hi);
    border-radius: 3px;
    padding: 12px 36px;
    margin: 10px 0;
    text-align: center;
    position: relative;
    background: rgba(0,255,200,0.015);
  }
  .motd-box::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 3px;
    background: linear-gradient(135deg,
      rgba(0,255,200,0.08) 0%,
      transparent 40%,
      transparent 60%,
      rgba(0,170,255,0.06) 100%
    );
    pointer-events: none;
    z-index: -1;
  }
  .motd-box .motd-row {
    white-space: pre;
    line-height: 1.8;
    color: var(--neon-cyan);
    text-shadow: 0 0 6px var(--glow-cyan);
    font-size: 13px;
  }
  .motd-box .motd-sep {
    height: 1px;
    margin: 7px 0;
    border: none;
    border-top: 1px dashed rgba(0,255,200,0.1);
  }

  /* ── neofetch ASCII art ─────────────────────────────────── */
  .neofetch-line {
    color: var(--neon-cyan);
    text-shadow: 0 0 8px var(--glow-cyan);
  }
  .neofetch-info {
    color: var(--text);
  }

  /* ── input line ─────────────────────────────────────────────── */
  #input-line {
    display: flex;
    align-items: center;
    min-height: 1.78em;
    position: relative;
    z-index: 1;
  }
  #prompt {
    color: var(--neon-cyan);
    text-shadow: 0 0 10px var(--glow-cyan), 0 0 25px rgba(0,255,200,0.06);
    white-space: pre;
    user-select: none;
    font-weight: 500;
  }
  #input-text {
    white-space: pre;
    color: var(--text-bright);
  }
  #cursor {
    display: inline-block;
    width: 0.6em;
    height: 1.12em;
    background: var(--neon-cyan);
    margin-left: 1px;
    animation: cursorBlink 1s step-end infinite;
    vertical-align: text-bottom;
    border-radius: 1px;
    box-shadow: 0 0 8px var(--glow-cyan), 0 0 20px rgba(0,255,200,0.08);
  }
  @keyframes cursorBlink {
    0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--glow-cyan), 0 0 20px rgba(0,255,200,0.08); }
    50% { opacity: 0; box-shadow: none; }
  }

  #hidden-input {
    position: fixed;
    left: -9999px;
    opacity: 0;
    font-size: 16px;
    pointer-events: none;
  }

  /* ── glitch effect ──────────────────────────────────────────── */
  .glitch {
    position: relative;
    animation: glitchShift 8s ease-in-out infinite;
  }
  @keyframes glitchShift {
    0%, 96%, 100% { transform: translate(0); }
    97% { transform: translate(-2px, 1px); filter: hue-rotate(20deg); }
    97.5% { transform: translate(1px, -1px); }
    98% { transform: translate(0); filter: none; }
  }

  /* ── status indicator ───────────────────────────────────────── */
  .status-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--neon-green);
    box-shadow: 0 0 6px rgba(0,255,136,0.5), 0 0 14px rgba(0,255,136,0.2);
    animation: statusPulse 2s ease-in-out infinite;
    vertical-align: middle;
    margin-right: 4px;
  }
  @keyframes statusPulse {
    0%, 100% { box-shadow: 0 0 6px rgba(0,255,136,0.5), 0 0 14px rgba(0,255,136,0.2); }
    50% { box-shadow: 0 0 10px rgba(0,255,136,0.7), 0 0 24px rgba(0,255,136,0.3); }
  }

  /* ── flicker on boot ────────────────────────────────────────── */
  .crt-flicker {
    animation: crtOn 0.4s ease-out;
  }
  @keyframes crtOn {
    0%   { opacity: 0; filter: brightness(30) saturate(0); transform: scaleY(0.005); }
    30%  { opacity: 1; filter: brightness(5) saturate(0.5); transform: scaleY(1.02); }
    50%  { filter: brightness(2) saturate(0.8); transform: scaleY(0.99); }
    70%  { filter: brightness(1.3); transform: scaleY(1.005); }
    100% { opacity: 1; filter: brightness(1) saturate(1); transform: scaleY(1); }
  }

  /* ── responsive ─────────────────────────────────────────────── */
  @media (max-width: 800px) {
    .window {
      max-width: 100%;
      max-height: 100vh;
      border-radius: 0;
      border: none;
      animation: none;
    }
    .window::before, .window::after { border-radius: 0; }
    .window:hover, .window:focus-within { border-color: transparent; }
    body { font-size: 12.5px; }
    .body { padding: 14px 12px; }
    .motd-box { padding: 8px 20px; }
    .titlebar .hex-addr { display: none; }
  }

  ::selection {
    background: rgba(0,255,200,0.2);
    color: var(--neon-cyan);
  }
</style>
</head>

function t(key) { const v = T[key]; return v ? v[L] : key; }

// ── helpers ──────────────────────────────────────────────────────
function getMotdLines() { return T.motd[L]; }

function buildMotdBox() {
  const box = document.createElement('div');
  box.className = 'motd-box';
  getMotdLines().forEach(text => {
    if (text === null) {
      const sep = document.createElement('hr');
      sep.className = 'motd-sep';
      box.appendChild(sep);
    } else {
      const row = document.createElement('div');
      row.className = 'motd-row';
      row.textContent = text;
      box.appendChild(row);
    }
  });
  return box;
}

function addLine(text, cls) {
  const d = document.createElement('div');
  d.className = 'line' + (cls ? ' ' + cls : '');
  d.textContent = text;
  output.appendChild(d);
}
function addHTML(html, cls) {
  const d = document.createElement('div');
  d.className = 'line' + (cls ? ' ' + cls : '');
  d.innerHTML = html;
  output.appendChild(d);
}
function addEl(el) {
  const wrap = document.createElement('div');
  wrap.className = 'line';
  wrap.appendChild(el);
  output.appendChild(wrap);
}
function scrollDown() { body.scrollTop = body.scrollHeight; }
function scrollIfNearBottom() {
  if (body.scrollHeight - body.scrollTop - body.clientHeight < 50)
    body.scrollTop = body.scrollHeight;
}
function drawInput() {
  inText.textContent = cmdBuffer;
  scrollIfNearBottom();
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── render the full welcome screen (used by skipAnim only) ───────

/* ── typewriter engine ───────────────────────────────────────── */
const sleep = ms => new Promise(r => setTimeout(r, ms));

function skipAnim() {
  if (booted) return;
  animToken++;
  renderWelcome();
  finishBoot();
}

async function type(text, cls, speed) {
  const token = ++animToken;
  const el = document.createElement('div');
  el.className = 'line' + (cls ? ' ' + cls : '');
  el.textContent = '';
  output.appendChild(el);
  for (const ch of text) {
    if (animToken !== token) { el.textContent = text; return; }
    el.textContent += ch;
    scrollDown();
    await sleep(speed || (10 + Math.random() * 28));
  }
}

async function typeMotdRow(text) {
  if (booted) return;
  const token = ++animToken;
  const d = document.createElement('div');
  d.className = 'motd-row';
  d.textContent = '';
  d.style.whiteSpace = 'pre';

  const boxes = output.querySelectorAll('.motd-box');
  const box = boxes[boxes.length - 1];
  if (box) box.appendChild(d);

  for (const ch of text) {
    if (animToken !== token) { d.textContent = text; return; }
    d.textContent += ch;
    scrollDown();
    await sleep(4);
  }
}

async function typeMotdSep() {
  if (booted) return;
  const boxes = output.querySelectorAll('.motd-box');
  const box = boxes[boxes.length - 1];
  if (!box) return;
  const sep = document.createElement('hr');
  sep.className = 'motd-sep';
  box.appendChild(sep);
  scrollDown();
  await sleep(50);
}

async function bootSequence() {
  prompt.textContent = '';
  cursor.style.display = 'none';

  await sleep(500);
  if (booted) return;

  await type(P + 'whoami', 'dim', 18);
  if (booted) return;
  await sleep(180);

  await type(t('whoami_name'), 'neon', 32);
  if (booted) return;
  await sleep(380);

  await type(P + 'cat /etc/motd', 'dim', 18);
  if (booted) return;
  await sleep(140);

  const box = document.createElement('div');
  box.className = 'motd-box';
  const wrap = document.createElement('div');
  wrap.className = 'line';
  wrap.appendChild(box);
  output.appendChild(wrap);

  for (const text of getMotdLines()) {
    if (booted) return;
    if (text === null) {
      await typeMotdSep();
    } else {
      await typeMotdRow(text);
    }
  }

  await sleep(280);
  if (booted) return;
  addLine('');
  addLine(t('boot_hint'), 'dim');
  addLine('');

  finishBoot();
}

function finishBoot() {
  booted = true;
  acceptingInput = true;
  prompt.textContent = P;
  cursor.style.display = 'inline-block';
  scrollDown();
  hidden.focus();
}

/* ── input handling ──────────────────────────────────────────── */
hidden.addEventListener('input', () => {
  if (!acceptingInput || composing) return;
  cmdBuffer = hidden.value;
  drawInput();
});
hidden.addEventListener('compositionstart', () => { composing = true; });
hidden.addEventListener('compositionend', () => {
  composing = false;
  cmdBuffer = hidden.value;
  drawInput();
});

hidden.addEventListener('keydown', e => {
  if (!acceptingInput) { e.preventDefault(); skipAnim(); return; }

  switch (e.key) {
    case 'Enter': {
      e.preventDefault();
      const cmd = cmdBuffer;
      hidden.value = '';
      cmdBuffer = '';
      drawInput();
      run(cmd);
      break;
    }
    case 'ArrowUp': {
      e.preventDefault();
      if (!history.length) return;
      if (historyIdx === history.length) historyIdx = history.length - 1;
      else if (historyIdx > 0) historyIdx--;
      hidden.value = history[historyIdx];
      cmdBuffer = hidden.value;
      drawInput();
      break;
    }
    case 'ArrowDown': {
      e.preventDefault();
      if (historyIdx >= history.length - 1) {
        historyIdx = history.length;
        hidden.value = '';
        cmdBuffer = '';
      } else {
        historyIdx++;
        hidden.value = history[historyIdx];
        cmdBuffer = hidden.value;
      }
      drawInput();
      break;
    }
    case 'Tab': {
      e.preventDefault();
      const cmds = ['whoami','projects','links','status','neofetch','motd','repo','date','clear','help'];
      const match = cmds.find(x => x.startsWith(cmdBuffer.trim().toLowerCase()));
      if (match) { hidden.value = match; cmdBuffer = match; drawInput(); }
      break;
    }
    case 'l':
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        output.innerHTML = '';
        scrollDown();
      }
      break;
    case 'Backspace':
      requestAnimationFrame(() => { cmdBuffer = hidden.value; drawInput(); });
      break;
  }
});

body.addEventListener('click', e => {
  if (e.target.closest('a')) return;
  if (acceptingInput) hidden.focus();
  else skipAnim();
});
