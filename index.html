<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="XiaoYuan151 — 17, student, vibe coder, Neuro drone">
<title>XiaoYuan151</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2215%22 fill=%22%2311161d%22/%3E<text y=%22.68em%22 x=%2250%22 text-anchor=%22middle%22 font-size=%2256%22 font-family=%22monospace%22 fill=%22%234ce084%22>~</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep:    #080b10;
    --bg-window:  #0f141b;
    --bg-title:   #161b24;
    --border:     #232832;
    --border-hi:  #343d4d;
    --border-focus: rgba(100,155,220,0.3);
    --text:       #c2cad4;
    --text-dim:   #586371;
    --text-info:  #82bcf8;
    --text-link:  #6faef5;
    --text-green: #4ce084;
    --text-red:   #f47272;
    --text-amber: #fbc050;
    --shadow-key: rgba(0,0,0,0.6);
    --shadow-amb: rgba(0,0,0,0.35);
  }

  html, body { height: 100%; background: var(--bg-deep); }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cascadia Code', 'Sarasa Mono SC', 'Sarasa Mono TC', 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Menlo', 'Consolas', 'Courier New', monospace;
    font-size: 14px;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(28,50,78,0.3) 0%, transparent 65%),
      radial-gradient(ellipse at 82% 18%, rgba(18,38,65,0.18) 0%, transparent 48%),
      radial-gradient(ellipse at 20% 80%, rgba(15,28,45,0.12) 0%, transparent 55%),
      var(--bg-deep);
  }

  /* ── window ──────────────────────────────────────────────────── */
  .window {
    width: 100%;
    max-width: 740px;
    height: 100vh;
    max-height: 530px;
    background: var(--bg-window);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.015) inset,
      0 0 0.5px 1px rgba(0,0,0,0.4),
      0 2px 6px rgba(0,0,0,0.25),
      0 8px 24px var(--shadow-amb),
      0 20px 60px var(--shadow-key),
      0 0 140px rgba(24,55,95,0.07);
    animation: windowIn 0.55s cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }
  @keyframes windowIn {
    from { opacity: 0; transform: translateY(14px) scale(0.986); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .window:hover { border-color: var(--border-hi); }
  .window:focus-within { border-color: var(--border-focus); }

  /* ── titlebar ────────────────────────────────────────────────── */
  .titlebar {
    position: relative;
    background: var(--bg-title);
    padding: 9px 14px;
    display: flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
    user-select: none;
    border-bottom: 1px solid rgba(255,255,255,0.025);
  }
  .dot {
    width: 11px; height: 11px;
    border-radius: 50%;
    flex-shrink: 0;
    position: relative;
    transition: filter 0.2s;
  }
  .dot.r { background: #ed6a5e; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.2) inset; }
  .dot.y { background: #f5bd4f; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.2) inset; }
  .dot.g { background: #61c454; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.2) inset; }
  .dot:hover { filter: brightness(1.3); }

  /* button glyphs — always visible, brighten on hover */
  .dot::after {
    content: '';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 6.5px;
    font-weight: 700;
    line-height: 1;
    color: rgba(0,0,0,0.5);
    opacity: 0.6;
    transition: opacity 0.18s;
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif;
    pointer-events: none;
  }
  .dot.r::after { content: '\00d7'; }  /* × */
  .dot.y::after { content: '\2212'; }  /* − */
  .dot.g::after { content: '\002b'; }  /* + */
  .dot:hover::after { opacity: 1; }

  .titlebar .title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11.5px;
    color: var(--text-dim);
    letter-spacing: 0.35px;
    pointer-events: none;
  }

  /* ── body ────────────────────────────────────────────────────── */
  .body {
    flex: 1;
    padding: 18px 20px;
    overflow-y: auto;
    cursor: text;
    line-height: 1.72;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    position: relative;
  }
  .body::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.016;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 160px 160px;
    z-index: 0;
  }
  .body::-webkit-scrollbar { width: 5px; }
  .body::-webkit-scrollbar-track { background: transparent; }
  .body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .body::-webkit-scrollbar-thumb:hover { background: var(--border-hi); }

  /* ── output + input ──────────────────────────────────────────── */
  #output { position: relative; z-index: 1; }
  #output .line {
    white-space: pre;
    min-height: 1.45em;
  }
  #output .line.dim  { color: var(--text-dim); }
  #output .line.err  { color: var(--text-red); }
  #output .line.info { color: var(--text-info); }
  #output .line.warn { color: var(--text-amber); }
  #output a {
    color: var(--text-link);
    text-decoration: none;
    transition: color 0.15s;
  }
  #output a:hover { color: #add6ff; text-decoration: underline; }

  /* ── MOTD box (CSS border, always aligned) ───────────────────── */
  .motd-box {
    display: inline-block;
    border: 1px solid var(--border-hi);
    border-radius: 2px;
    padding: 10px 34px;
    margin: 8px 0;
    text-align: center;
  }
  .motd-box .motd-row {
    white-space: pre;
    line-height: 1.75;
    color: var(--text-info);
  }
  .motd-box .motd-sep {
    height: 1px;
    margin: 6px 0;
    border: none;
    border-top: 1px dashed rgba(255,255,255,0.06);
  }

  /* ── input line ──────────────────────────────────────────────── */
  #input-line {
    display: flex;
    align-items: center;
    min-height: 1.72em;
    position: relative;
    z-index: 1;
  }
  #prompt {
    color: var(--text-green);
    white-space: pre;
    user-select: none;
  }
  #input-text { white-space: pre; }
  #cursor {
    display: inline-block;
    width: 0.58em;
    height: 1.08em;
    background: rgba(194,202,212,0.9);
    margin-left: 1px;
    animation: cursorBlink 1s step-end infinite;
    vertical-align: text-bottom;
    border-radius: 1px;
    box-shadow: 0 0 6px rgba(194,202,212,0.15);
  }
  @keyframes cursorBlink { 50% { opacity: 0; } }

  #hidden-input {
    position: fixed;
    left: -9999px;
    opacity: 0;
    font-size: 16px;
    pointer-events: none;
  }

  @media (max-width: 750px) {
    .window {
      max-width: 100%;
      max-height: 100vh;
      border-radius: 0;
      border: none;
      box-shadow: none;
      animation: none;
    }
    .window:hover, .window:focus-within { border-color: transparent; }
    body { font-size: 13px; }
    .body { padding: 12px 10px; }
    .motd-box { padding: 8px 20px; }
  }
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="title">XiaoYuan151 — zsh — 80×24</span>
  </div>
  <div class="body" id="terminal-body">
    <div id="output"></div>
    <div id="input-line">
      <span id="prompt"></span><span id="input-text"></span><span id="cursor"></span>
    </div>
  </div>
</div>

<input id="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

<script>
const $ = s => document.getElementById(s);
const output  = $('output');
const prompt  = $('prompt');
const inText  = $('input-text');
const cursor  = $('cursor');
const hidden  = $('hidden-input');
const body    = $('terminal-body');

let cmdBuffer      = '';
let composing      = false;
let history        = [];
let historyIdx     = -1;
let animToken      = 0;
let booted         = false;
let acceptingInput = false;

const P = '~ % ';
const L = (navigator.language || 'en').startsWith('zh') ? 1 : 0;

// ── i18n dictionary ────────────────────────────────────────────
// [English, 中文]
const T = {
  motd: [
    ['XiaoYuan151 — 17', 'Guilin, Guangxi — BGP AS209601', null,
     'C#  Python  Rust  JavaScript', 'BGP  Reverse Eng.  Audio  v2ray', null,
     'Neuro-sama oshi — SiiWay — Bilibili'],
    ['小源151 — 17岁', '广西桂林 — BGP AS209601', null,
     'C#  Python  Rust  JavaScript', 'BGP  逆向  混音  v2ray', null,
     'Neuro-sama 单推 — SiiWay — B站'],
  ],
  whoami_name:  ['XiaoYuan151 / 小源151 / 源神987', '小源151 / 源神987 / XiaoYuan151'],
  whoami_info:  ['17 | Student | BGP Player (AS209601)', '17岁 | 学生 | BGP Player (AS209601)'],
  whoami_loc:   ['Guilin, Guangxi, China', '中国广西桂林'],
  boot_hint:    ['Type help for available commands', '输入 help 查看可用命令'],

  help_title:   ['Available commands:', '可用命令：'],
  help_whoami:  ['whoami      about me', 'whoami      关于我'],
  help_projects:['projects    things I\'ve worked on', 'projects    做过的项目'],
  help_links:   ['links       find me online', 'links       找到我'],
  help_status:  ['status      current status', 'status      当前状态'],
  help_neofetch:['neofetch    system information', 'neofetch    系统信息'],
  help_motd:    ['motd        print /etc/motd', 'motd        显示 /etc/motd'],
  help_repo:    ['repo        source code', 'repo        源代码'],
  help_date:    ['date        current date & time', 'date        当前日期时间'],
  help_clear:   ['clear       clear screen', 'clear       清屏'],
  help_help:    ['help        show this message', 'help        显示此帮助'],
  help_footer:  ['Type any unrecognized command for a response', '输任意命令试试'],

  proj_title:   ['GyakutenNeuro — fan translation (zh-CN)', '逆转Neuro — 同人游戏中文化'],
  proj_tl:      ['  contributed a significant portion of the translation', '  参与了大部分翻译'],
  proj_studio:  ['XiaoYuan Studio — tools & experiments', 'XiaoYuan Studio — 工具与实验'],
  proj_ai:      ['XiaoYuan AI — making interesting things', 'XiaoYuan AI — 做些有趣的东西'],
  proj_bgp:     ['BGP Player — AS209601 with zero router', 'BGP Player — AS209601 (zero router)'],
  proj_neuro:   ['Neuro-sama fan content & DJ Mix @ Bilibili', 'Neuro-sama 相关二创 / DJ Mix @ B站'],
  proj_proxy:   ['vless/vmess proxy maintenance', 'vless/vmess 代理节点维护'],
  proj_shizuku: ['Shizuku karaoke player translation (Neuro & Evil TL team)', 'Shizuku 歌回播放器翻译（翻译组）'],
  proj_hw:      ['Hardware tinkering, overclocking, tech support', '硬件折腾、超频、技术支援'],

  status_on:    ['● online', '● 在线'],
  status_doing: ['Currently: coding / browsing / idle', '当前可能在：写代码 / 刷B站 / 摸鱼'],
  status_cpu:   ['CPU load: nominal', 'CPU 负载：正常'],

  neofetch_user:['xiaoyuan151@homepage', '小源151@homepage'],
  neofetch_os:  ['OS: Guilin, Guangxi, China', 'OS: 中国广西桂林'],
  neofetch_up:  ['Uptime: 17 years', 'Uptime: 17年'],
  neofetch_shell:['Shell: zsh', 'Shell: zsh'],
  neofetch_de:  ['DE: classroom — bedroom', 'DE: 教室 — 卧室'],
  neofetch_st:  ['Status: ● online', 'Status: ● 在线'],

  sudo_msg:     ['permission denied', '权限不足'],
  rm_msg:       ['operation not permitted', '操作不允许'],
  exit_msg:     ['not a login shell', '不是登录 shell'],

  neuro_title:  ['Hive / Drone | Neuro-sama fan community', '蜂群/工蜂 | Neuro-sama 粉丝社群'],
  neuro_stnc:   ['STNC Hive Tech Intel Center — member', 'STNC 蜂群技术情报中心 成员'],
  neuro_tl:     ['Neuro & Evil karaoke player TL team — member', 'Neuro & Evil 歌回播放器翻译组 成员'],
  neuro_osu:    ['Osu! Osu! Osu!', 'Osu! Osu! Osu!'],

  darkweb_msg:  ['no.', '没有。'],

  repo_title:   ['source code for this page:', '本页源代码：'],

  love_msg:     ['not applicable', '不适用'],

  cmd_notfound: ['zsh: command not found: ', 'zsh: 未找到命令: '],
  cmd_tryhelp:  ['type help for available commands', '输入 help 查看可用命令'],
};

function t(key) { const v = T[key]; return v ? v[L] : key; }

// ── MOTD ─────────────────────────────────────────────────────
function getMotdLines() { return T.motd[L]; }

function renderMotd() {
  const box = document.createElement('div');
  box.className = 'motd-box';

  getMotdLines().forEach((text) => {
    if (text === null) {
      const sep = document.createElement('hr');
      sep.className = 'motd-sep';
      box.appendChild(sep);
    } else {
      const row = document.createElement('div');
      row.className = 'motd-row info';
      row.textContent = text;
      box.appendChild(row);
    }
  });

  addEl(box);
}

function addLine(text, cls) {
  const d = document.createElement('div');
  d.className = 'line' + (cls ? ' ' + cls : '');
  d.textContent = text;
  output.appendChild(d);
}
function addHTML(html, cls) {
  const d = document.createElement('div');
  d.className = 'line' + (cls ? ' ' + cls : '');
  d.innerHTML = html;
  output.appendChild(d);
}
function addEl(el) {
  const wrap = document.createElement('div');
  wrap.className = 'line';
  wrap.appendChild(el);
  output.appendChild(wrap);
}
function scrollDown() {
  body.scrollTop = body.scrollHeight;
}
function scrollIfNearBottom() {
  if (body.scrollHeight - body.scrollTop - body.clientHeight < 50) {
    body.scrollTop = body.scrollHeight;
  }
}
function drawInput() {
  inText.textContent = cmdBuffer;
  scrollIfNearBottom();
}

function renderWelcome() {
  output.innerHTML = '';
  addLine(P + 'whoami', 'dim');
  addLine(t('whoami_name'));
  addLine(P + 'cat /etc/motd', 'dim');
  renderMotd();
  addLine('');
  addLine(t('boot_hint'), 'dim');
  addLine('');
}

// ── hidden commands (triggers encoded) ─────────────────────────
const _d  = s => atob(s);
const _du = s => decodeURIComponent(s);

const _e = new Map([
  [_d('c3Vkbw=='),           'sudo'],
  [_d('cm0='),               'rm'],
  [_d('cm0gLXJm'),           'rm'],
  [_d('cm0gLXJmIC8='),       'rm'],
  [_d('ZXhpdA=='),           'exit'],
  [_d('bG9nb3V0'),           'exit'],
  [_d('bmV1cm8='),           'neuro'],
  [_d('bnQ='),               'neuro'],
  [_du('%E8%9C%82%E7%BE%A4'),'neuro'],
  [_du('%E6%9A%97%E7%BD%91'),'darkweb'],
  [_du('%E6%81%8B%E7%88%B1'),'love'],
  [_du('%E6%81%8B%E6%84%9B'),'love'],
]);

function _runHidden(type) {
  switch (type) {
    case 'sudo':   addLine(t('sudo_msg'), 'err'); break;
    case 'rm':     addLine(t('rm_msg'), 'err'); break;
    case 'exit':   addLine(t('exit_msg'), 'warn'); break;
    case 'neuro':
      addLine(t('neuro_title'));
      addLine(t('neuro_stnc'));
      addLine(t('neuro_tl'));
      addLine('');
      addLine(t('neuro_osu'));
      break;
    case 'darkweb': addLine(t('darkweb_msg'), 'err'); break;
    case 'love':    addLine(t('love_msg'), 'dim'); break;
  }
}

function run(cmd) {
  addLine(P + cmd, 'dim');
  const c = cmd.trim();
  if (!c) { scrollDown(); return; }

  history.push(c);
  historyIdx = history.length;

  if (_e.has(c)) { _runHidden(_e.get(c)); scrollDown(); return; }

  switch (c) {
    case 'help':
    case '?':
      addLine(t('help_whoami'));
      addLine(t('help_projects'));
      addLine(t('help_links'));
      addLine(t('help_status'));
      addLine(t('help_neofetch'));
      addLine(t('help_motd'));
      addLine(t('help_repo'));
      addLine(t('help_date'));
      addLine(t('help_clear'));
      addLine(t('help_help'));
      addLine('');
      addLine(t('help_footer'));
      break;

    case 'whoami':
      addLine(t('whoami_name'));
      addLine(t('whoami_info'));
      addLine(t('whoami_loc'));
      break;

    case 'projects':
      addLine(t('proj_title'));
      addLine(t('proj_tl'), 'dim');
      addLine(t('proj_studio'), 'dim');
      addLine(t('proj_ai'), 'dim');
      addLine(t('proj_bgp'), 'dim');
      addLine(t('proj_neuro'), 'dim');
      addLine(t('proj_proxy'), 'dim');
      addLine(t('proj_shizuku'), 'dim');
      addLine(t('proj_hw'), 'dim');
      break;

    case 'links':
      addHTML('GitHub    <a href="https://github.com/XiaoYuan151" target="_blank" rel="noopener">github.com/XiaoYuan151</a>');
      addHTML('Bilibili  <a href="https://space.bilibili.com/488570832" target="_blank" rel="noopener">space.bilibili.com/488570832</a>');
      addHTML('Blog      <a href="https://blog.xiaoyuan151.com" target="_blank" rel="noopener">blog.xiaoyuan151.com</a>');
      break;

    case 'motd':
      renderMotd();
      break;

    case 'status':
      addLine(t('status_on'));
      addLine(t('status_doing'));
      addLine(t('status_cpu'));
      break;

    case 'neofetch':
      addLine('         .---.');
      addLine('        /     \\    ' + t('neofetch_user'));
      addLine('        \\.@-@./    ────────────────');
      addLine("        /`\\_/`\\    " + t('neofetch_os'));
      addLine('       //  _  \\\\   ' + t('neofetch_up'));
      addLine('      | \\     )|_  ' + t('neofetch_shell'));
      addLine("     /`\\_`>  <_/ \\  " + t('neofetch_de'));
      addLine("     \\__/'---'\\__/  " + t('neofetch_st'));
      break;

    case 'date':
      addLine(new Date().toString());
      break;

    case 'clear':
      output.innerHTML = '';
      break;

    case 'repo':
    case 'source':
      addLine(t('repo_title'));
      addHTML('<a href="https://github.com/XiaoYuan151/Homepage" target="_blank" rel="noopener">github.com/XiaoYuan151/Homepage</a>');
      break;

    default:
      addLine(t('cmd_notfound') + c, 'err');
      addLine(t('cmd_tryhelp'), 'dim');
  }
  scrollDown();
}

/* ── typewriter ────────────────────────────────────────────────── */
function skipAnim() {
  if (booted) return;
  booted = true;
  animToken++;
  renderWelcome();
  finishBoot();
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function type(text, cls, speed) {
  const token = ++animToken;
  const el = document.createElement('div');
  el.className = 'line' + (cls ? ' ' + cls : '');
  el.textContent = '';
  output.appendChild(el);
  for (const ch of text) {
    if (animToken !== token) { el.textContent = text; return; }
    el.textContent += ch;
    scrollDown();
    await sleep(speed || (14 + Math.random() * 34));
  }
}

async function typeMotdRow(text) {
  if (booted) return;
  const token = ++animToken;
  const d = document.createElement('div');
  d.className = 'motd-row info';
  d.textContent = '';
  d.style.whiteSpace = 'pre';

  const boxes = output.querySelectorAll('.motd-box');
  const box = boxes[boxes.length - 1];
  if (box) box.appendChild(d);

  for (const ch of text) {
    if (animToken !== token) { d.textContent = text; return; }
    d.textContent += ch;
    scrollDown();
    await sleep(5);
  }
}

async function typeMotdSep() {
  if (booted) return;
  const token = ++animToken;
  const boxes = output.querySelectorAll('.motd-box');
  const box = boxes[boxes.length - 1];
  if (!box) return;
  const sep = document.createElement('hr');
  sep.className = 'motd-sep';
  box.appendChild(sep);
  scrollDown();
  await sleep(60);
}

async function bootSequence() {
  prompt.textContent = '';
  cursor.style.display = 'none';

  await sleep(350);
  await type(P + 'whoami', 'dim', 22);
  await sleep(220);
  await type(t('whoami_name'), '', 38);
  await sleep(420);

  await type(P + 'cat /etc/motd', 'dim', 22);
  await sleep(160);

  // Create the motd box
  const box = document.createElement('div');
  box.className = 'motd-box';
  const wrap = document.createElement('div');
  wrap.className = 'line';
  wrap.appendChild(box);
  output.appendChild(wrap);

  for (const text of getMotdLines()) {
    if (text === null) {
      await typeMotdSep();
    } else {
      await typeMotdRow(text);
    }
  }

  await sleep(320);
  if (booted) return;
  addLine('');
  addLine(t('boot_hint'), 'dim');
  addLine('');

  finishBoot();
}

function finishBoot() {
  booted = true;
  acceptingInput = true;
  prompt.textContent = P;
  cursor.style.display = 'inline-block';
  scrollDown();
  hidden.focus();
}

/* ── input handling ────────────────────────────────────────────── */
hidden.addEventListener('input', () => {
  if (!acceptingInput || composing) return;
  cmdBuffer = hidden.value;
  drawInput();
});
hidden.addEventListener('compositionstart', () => { composing = true; });
hidden.addEventListener('compositionend', () => {
  composing = false;
  cmdBuffer = hidden.value;
  drawInput();
});

hidden.addEventListener('keydown', e => {
  if (!acceptingInput) { e.preventDefault(); skipAnim(); return; }

  switch (e.key) {
    case 'Enter': {
      e.preventDefault();
      const cmd = cmdBuffer;
      hidden.value = '';
      cmdBuffer = '';
      drawInput();
      run(cmd);
      break;
    }
    case 'ArrowUp': {
      e.preventDefault();
      if (!history.length) return;
      if (historyIdx === history.length) historyIdx = history.length - 1;
      else if (historyIdx > 0) historyIdx--;
      hidden.value = history[historyIdx];
      cmdBuffer = hidden.value;
      drawInput();
      break;
    }
    case 'ArrowDown': {
      e.preventDefault();
      if (historyIdx >= history.length - 1) {
        historyIdx = history.length;
        hidden.value = '';
        cmdBuffer = '';
      } else {
        historyIdx++;
        hidden.value = history[historyIdx];
        cmdBuffer = hidden.value;
      }
      drawInput();
      break;
    }
    case 'Tab': {
      e.preventDefault();
      const cmds = ['whoami','projects','links','status','neofetch','motd','repo','date','clear','help'];
      const match = cmds.find(x => x.startsWith(cmdBuffer.trim().toLowerCase()));
      if (match) { hidden.value = match; cmdBuffer = match; drawInput(); }
      break;
    }
    case 'l':
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        output.innerHTML = '';
        scrollDown();
      }
      break;
    case 'Backspace':
      requestAnimationFrame(() => { cmdBuffer = hidden.value; drawInput(); });
      break;
  }
});

body.addEventListener('click', e => {
  if (e.target.closest('a')) return;
  if (acceptingInput) hidden.focus();
  else skipAnim();
});

bootSequence();
